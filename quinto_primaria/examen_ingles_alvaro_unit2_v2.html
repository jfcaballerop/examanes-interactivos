<style>
  :root {
    --primary: #2b5797;
    --secondary: #00a4ef;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #333333;
    --success: #2e7d32;
    --error: #c62828;
  }

  body {
    font: 17px "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    line-height: 1.6;
  }

  main {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 20px;
  }

  section,
  header {
    background: var(--card);
    padding: 22px;
    border-radius: 8px;
    margin: 20px 0;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
  }

  header {
    position: sticky;
    top: 0;
    background: var(--primary);
    color: white;
    padding: 15px 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px 16px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    z-index: 1000;
  }

  header h1 {
    margin: 0;
    font-size: 1.2rem;
  }

  header p {
    margin: 0;
  }

  .back-link {
    display: inline-block;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 6px;
    color: white;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
  }

  .back-link:hover,
  .back-link:focus-visible {
    background: rgba(255, 255, 255, 0.15);
  }

  .timer {
    font-size: 1.2rem;
    font-weight: bold;
    background: rgba(255, 255, 255, 0.2);
    padding: 5px 15px;
    border-radius: 20px;
  }

  button,
  input,
  select {
    font: inherit;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    margin: 5px;
    max-width: 95%
  }

  button {
    cursor: pointer;
    background: var(--card);
    color: var(--primary);
  }

  header select {
    border: 0;
  }

  button.primary,
  button.chosen {
    background: var(--primary);
    color: white
  }

  header button.primary {
    background: white;
    color: var(--primary);
  }

  button:disabled {
    opacity: .65;
    cursor: default
  }

  label {
    display: block
  }

  small {
    color: inherit
  }

  progress {
    width: 100%;
    accent-color: var(--primary)
  }

  blockquote {
    background: #e3f2fd;
    border-left: 5px solid var(--secondary);
    padding: 15px;
    border-radius: 4px;
    margin: 12px 0;
    line-height: 1.6
  }

  .ok {
    color: var(--success)
  }

  .bad {
    color: var(--error)
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px
  }

  h1 {
    margin: 0
  }

  input {
    width: 85%
  }

  button:focus-visible {
    outline: 3px solid var(--secondary)
  }

  @media (max-width: 600px) {
    main {
      padding: 0 12px;
    }

    header {
      position: static;
    }
  }
</style>
